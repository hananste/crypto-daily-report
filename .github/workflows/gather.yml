name: gather
on:
  schedule:
    - cron: "*/15 * * * *"   # snapshot -> data/latest.json
    - cron: "0 11 * * *"     # daily dated report, 7:00 AM ET (EDT; 6:00 AM ET in winter)
  workflow_dispatch:
    inputs:
      daily: {description: "Write dated daily report", type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: gather, cancel-in-progress: false}
jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Gather
        run: |
          if [ "${{ github.event.schedule }}" = "0 11 * * *" ] || [ "${{ inputs.daily }}" = "true" ]; then
            python3 gather.py --daily
          else
            python3 gather.py
          fi
      - name: Commit data
        run: |
          git config user.name "report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase && git push
